<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="t">
  <title id="t">planwright: a pickle with a robot antenna holding its plan</title>
  <!-- antenna -->
  <line x1="120" y1="40" x2="120" y2="16" stroke="#2f5d1f" stroke-width="5" stroke-linecap="round"/>
  <circle cx="120" cy="13" r="9" fill="#e2574c"/>
  <circle cx="117" cy="10" r="3" fill="#ffb3ab"/>
  <!-- pickle body -->
  <rect x="62" y="36" width="116" height="188" rx="58" fill="#5f9e3a" stroke="#2f5d1f" stroke-width="5"/>
  <path d="M84 70 Q80 130 88 196" stroke="#7fbf52" stroke-width="9" stroke-linecap="round" fill="none" opacity=".7"/>
  <!-- gherkin bumps -->
  <g fill="#3f7a26">
    <circle cx="150" cy="70" r="4.5"/><circle cx="96" cy="104" r="4"/><circle cx="158" cy="150" r="4.5"/>
    <circle cx="104" cy="178" r="4"/><circle cx="140" cy="200" r="3.5"/><circle cx="74" cy="140" r="3.5"/>
  </g>
  <!-- face: one eye is a camera/LED (agent), one winks (playwright comedy mask) -->
  <circle cx="102" cy="96" r="13" fill="#fff" stroke="#2f5d1f" stroke-width="4"/>
  <circle cx="105" cy="98" r="6" fill="#1d2b14"/>
  <circle cx="107" cy="95" r="2" fill="#fff"/>
  <path d="M130 96 Q141 86 152 96" stroke="#1d2b14" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M100 124 Q120 142 142 124" stroke="#1d2b14" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="88" cy="118" r="6" fill="#e2574c" opacity=".45"/>
  <circle cx="152" cy="118" r="6" fill="#e2574c" opacity=".45"/>
  <!-- the plan: a scroll of checked steps -->
  <g transform="rotate(-8 150 176)">
    <rect x="118" y="146" width="80" height="64" rx="6" fill="#fffaf0" stroke="#2f5d1f" stroke-width="4"/>
    <rect x="112" y="140" width="92" height="12" rx="6" fill="#f1e6cc" stroke="#2f5d1f" stroke-width="4"/>
    <g stroke-linecap="round" stroke-width="4" fill="none">
      <path d="M128 166 l5 5 9-10" stroke="#3f9e3a"/><path d="M148 167 h38" stroke="#b9ad93"/>
      <path d="M128 184 l5 5 9-10" stroke="#3f9e3a"/><path d="M148 185 h30" stroke="#b9ad93"/>
      <path d="M128 202 l5 5 9-10" stroke="#3f9e3a"/><path d="M148 203 h34" stroke="#b9ad93"/>
    </g>
  </g>
</svg>
